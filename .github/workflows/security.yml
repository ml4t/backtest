name: Security

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_NO_SOURCES: "1"
  PIP_AUDIT_VERSION: "2.10.1"
  BANDIT_VERSION: "1.9.4"

jobs:
  scan:
    name: Dependency and Source Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export the locked runtime dependency set
        run: >-
          uv export --locked --no-dev --no-emit-project --no-sources
          --format requirements-txt --quiet
          --output-file security-requirements.txt

      - name: Export the locked contributor and Zipline dependency sets
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project --no-sources \
            --format requirements-txt --quiet --output-file security-contributor-requirements.txt
          UV_NO_SOURCES=0 uv export --locked --directory validation/environments/zipline \
            --no-emit-project --no-emit-package ml4t-backtest \
            --format requirements-txt --quiet --output-file "$GITHUB_WORKSPACE/security-zipline-requirements.txt"

      - name: Scan dependencies and source
        run: |
          set +e
          uvx --from "pip-audit==$PIP_AUDIT_VERSION" pip-audit \
            --requirement security-requirements.txt --require-hashes --strict \
            --format json --output dependency-audit.json
          dependency_status=$?
          uvx --from "bandit==$BANDIT_VERSION" bandit \
            -r src/ml4t/backtest --severity-level medium --confidence-level medium \
            --format json --output source-security.json --quiet
          source_status=$?
          set -e
          test "$dependency_status" -le 1
          test "$source_status" -le 1

      - name: Scan contributor and Zipline dependencies
        run: |
          for profile in contributor zipline; do
            set +e
            uvx --python "${{ env.PYTHON_VERSION }}" --from "pip-audit==$PIP_AUDIT_VERSION" pip-audit \
              --requirement "security-${profile}-requirements.txt" --require-hashes --strict \
              --format json --output "dependency-audit-${profile}.json"
            dependency_status=$?
            set -e
            test "$dependency_status" -le 1
          done

      - name: Enforce the security policy
        run: >-
          uv run --no-project --python "${{ env.PYTHON_VERSION }}"
          python validation/check_security.py
          --requirements security-requirements.txt
          --dependency-report dependency-audit.json
          --source-report source-security.json
          --summary security-summary.json

      - name: Enforce contributor and Zipline security policy
        run: |
          for profile in contributor zipline; do
            uv run --no-project --python "${{ env.PYTHON_VERSION }}" \
              python validation/check_security.py \
              --requirements "security-${profile}-requirements.txt" \
              --dependency-report "dependency-audit-${profile}.json" \
              --source-report source-security.json --summary "security-summary-${profile}.json"
          done

      - name: Retain security inputs and outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence-${{ github.sha }}
          path: |
            security-requirements.txt
            dependency-audit.json
            source-security.json
            security-summary.json
            security-contributor-requirements.txt
            security-zipline-requirements.txt
            dependency-audit-contributor.json
            dependency-audit-zipline.json
            security-summary-contributor.json
            security-summary-zipline.json
            .github/security-policy.toml
            .github/security-exceptions.toml
          if-no-files-found: error
          retention-days: 90
