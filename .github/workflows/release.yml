name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ecosystem-qualification:
    name: Ecosystem Qualification
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@812cf4e7c28aaec93e57a94e39f897e963744378 # v0.1.0
    with:
      import-package: ml4t.backtest

  qualification:
    name: Qualify Release Candidate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ecosystem-qualification, qualification]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/

      - name: Verify candidate source, tag, and digests
        run: >-
          python validation/release_candidate.py verify
          --dist candidate/dist
          --manifest candidate/release-candidate.json
          --expected-commit "$GITHUB_SHA"
          --expected-repository "$GITHUB_REPOSITORY"
          --expected-tag "$GITHUB_REF_NAME"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: candidate/dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  verify-pypi:
    name: Verify PyPI Digests
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/

      - name: Compare published files with the candidate
        run: >-
          python validation/release_candidate.py verify-index
          --manifest candidate/release-candidate.json

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify-pypi
    permissions:
      contents: write
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          candidate/dist/* candidate/release-candidate.json
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --verify-tag
          --generate-notes
