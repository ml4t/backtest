name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ecosystem-qualification:
    name: Ecosystem Qualification
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@457678d8860d0c816b1dc376e7e2691daa93af4d # v0.1.0
    with:
      import-package: ml4t.backtest

  qualification:
    name: Qualify Release Candidate
    uses: ./.github/workflows/ci.yml

  private-comparisons:
    name: Qualify Licensed and Container Comparisons
    uses: ./.github/workflows/private-comparisons.yml
    secrets: inherit

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ecosystem-qualification, private-comparisons, qualification]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/

      - name: Verify candidate source, tag, and digests
        run: >-
          python validation/release_candidate.py verify
          --dist candidate/dist
          --manifest candidate/release-candidate.json
          --expected-commit "$GITHUB_SHA"
          --expected-repository "$GITHUB_REPOSITORY"
          --expected-tag "$GITHUB_REF_NAME"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  verify-pypi:
    name: Verify PyPI Digests
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/

      - name: Compare published files with the candidate
        run: >-
          python validation/release_candidate.py verify-index
          --manifest candidate/release-candidate.json

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify-pypi
    permissions:
      contents: write
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          candidate/dist/* candidate/release-candidate.json
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --verify-tag
          --generate-notes
