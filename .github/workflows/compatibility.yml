name: Compatibility

on:
  workflow_call:
  workflow_dispatch:

env:
  UV_NO_SOURCES: "1"

permissions:
  contents: read

jobs:
  stable:
    name: Stable (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test dependencies
        run: uv sync --dev --locked

      - name: Verify the runtime and package import
        run: >-
          uv run --no-sync python -c
          "import sys; import ml4t.backtest;
          assert f'{sys.version_info.major}.{sys.version_info.minor}' ==
          '${{ matrix.python-version }}'"

      - name: Run the non-hardware test suite
        run: uv run --no-sync pytest tests/ -v --tb=short --no-cov -m "not benchmark"

      - name: Type-check for Python ${{ matrix.python-version }}
        run: uv run --no-sync ty check --python-version ${{ matrix.python-version }}

      - name: Build the package
        run: uv build

      - name: Validate the shared comparison extra
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          ML4T_COMPARISON_INPROC: "1"
        run: |
          uv sync --dev --locked --extra comparison --extra viz
          uv run --no-sync pytest -q --no-cov \
            tests/contracts/test_cross_engine_contracts.py --junitxml=comparison-contracts.xml

      - name: Retain shared comparison contracts
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-comparison-contracts
          path: comparison-contracts.xml
          if-no-files-found: warn

  prerelease:
    name: Python 3.15 canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.15
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          python-version: "3.15"

      - name: Create the Python 3.15 environment
        run: uv venv --python 3.15

      - name: Install the CPython 3.15 numerical runtime
        run: >-
          uv pip install
          --index https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
          --prerelease allow --only-binary :all:
          "numpy>=2.6.0.dev0"

      - name: Install pandas build dependencies
        run: >-
          uv pip install
          "meson-python>=0.17.1,<1" "meson>=1.2.1,<2" wheel
          "Cython>3.1.0,<4" "versioneer[toml]" "ninja>=1.8.2"

      - name: Install the package and test dependencies
        run: >-
          uv pip install --no-cache --prerelease allow
          --no-build-isolation-package pandas
          --editable . --group test

      - name: Verify CPython 3.15 and package import
        run: >-
          uv run --no-sync python -c
          "import sys; import numpy; import pandas; import ml4t.backtest;
          from packaging.version import Version;
          assert sys.version_info[:2] == (3, 15);
          assert sys.version_info.releaselevel in {'beta', 'candidate', 'final'};
          assert Version(numpy.__version__) >= Version('2.6.0.dev0')"

      - name: Run the non-hardware test suite
        run: uv run --no-sync pytest tests/ -v --tb=short --no-cov -m "not benchmark"

      - name: Record the Python 3.15 dependency set
        run: uv pip freeze > prerelease-versions-${{ runner.os }}.txt

      - name: Retain Python 3.15 dependency evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prerelease-versions-${{ runner.os }}
          path: prerelease-versions-${{ runner.os }}.txt
          if-no-files-found: error

  minimum:
    name: Minimum Dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install the lowest direct dependency set
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --resolution lowest-direct --only-binary :all: \
            --no-binary ml4t-backtest --editable . --group test "ty>=0.0.18"

      - name: Record the resolved versions
        run: uv pip freeze > minimum-versions-${{ matrix.python-version }}.txt

      - name: Verify package import
        run: uv run --no-sync python -c "import ml4t.backtest"

      - name: Run the non-hardware test suite
        run: uv run --no-sync pytest tests/ -v --tb=short --no-cov -m "not benchmark"

      - name: Type-check for Python ${{ matrix.python-version }}
        run: uv run --no-sync ty check --python-version ${{ matrix.python-version }}

      - name: Build the package
        run: uv build

      - name: Retain minimum-version evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimum-versions-${{ matrix.python-version }}
          path: minimum-versions-${{ matrix.python-version }}.txt
          if-no-files-found: error

  gate:
    name: Compatibility Gate
    if: always()
    needs: [stable, prerelease, minimum]
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility job
        run: |
          test "${{ needs.stable.result }}" = "success"
          test "${{ needs.prerelease.result }}" = "success"
          test "${{ needs.minimum.result }}" = "success"
